<svg fill="none" viewBox="0 0 800 400" width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes twinkle {
          0%, 100% { opacity: 0.2; transform: scale(1); }
          50% { opacity: 1; transform: scale(1.2); }
        }

        @keyframes float {
          0%, 100% { transform: translateY(0px) rotate(0deg); }
          50% { transform: translateY(-8px) rotate(2deg); }
        }

        .space-container {
          --color-primary: #6F61EF;
          --color-secondary: #F9CF58;
          --color-tertiary: #9489F5;
          --color-neutral: #F1F4F8;
          --color-dark: #121424;
          --color-darker: #080A12;

          background: radial-gradient(circle at 50% 50%, var(--color-dark) 0%, var(--color-darker) 100%);
          width: 800px;
          height: 400px;
          position: relative;
          overflow: hidden;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          border-radius: 20px;
          box-sizing: border-box;
          border: 1px solid rgba(148, 137, 245, 0.15);
          box-shadow: inset 0 0 100px rgba(11px, 12px, 20px, 0.5);
        }

        .stars {
          position: absolute;
          width: 100%;
          height: 100%;
          z-index: 1;
        }

        .star {
          position: absolute;
          background: white;
          border-radius: 50%;
          box-shadow: 0 0 4px white;
        }

        .nebula {
          position: absolute;
          filter: blur(90px);
          z-index: 1;
          opacity: 0.4;
          border-radius: 50%;
        }

        .nebula-1 {
          background: var(--color-primary);
          width: 500px;
          height: 500px;
          top: -250px;
          left: -150px;
        }

        .nebula-2 {
          background: var(--color-tertiary);
          width: 400px;
          height: 400px;
          bottom: -200px;
          right: -100px;
          opacity: 0.3;
        }

        .ambient-shape {
          position: absolute;
          z-index: 2;
          animation: float 7s ease-in-out infinite;
        }

        .shape-circle-top {
          width: 250px;
          height: 250px;
          border-radius: 50%;
          border: 1px solid rgba(148, 137, 245, 0.1);
          background: radial-gradient(circle, rgba(148, 137, 245, 0.05) 0%, transparent 60%);
          top: -80px;
          right: -80px;
        }

        .shape-circle-bottom {
          width: 150px;
          height: 150px;
          border-radius: 50%;
          background: rgba(111, 97, 239, 0.1);
          filter: blur(8px);
          bottom: -30px;
          left: -40px;
          animation-delay: -2s;
        }

        .shape-triangle {
          right: 30px;
          top: 170px;
          width: 50px;
          height: 50px;
          animation: float 5s ease-in-out infinite;
          opacity: 0.9;
        }

        .content {
          position: relative;
          z-index: 10;
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
          width: 100%;
        }

        .pill-container {
          margin-bottom: 24px;
        }

        .pill {
          display: inline-flex;
          align-items: center;
          padding: 6px 20px;
          border-radius: 100px;
          border: 1px solid rgba(148, 137, 245, 0.4);
          background: rgba(148, 137, 245, 0.1);
          color: var(--color-tertiary);
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          font-size: 11px;
          font-weight: 700;
          letter-spacing: 2.5px;
          text-transform: uppercase;
          backdrop-filter: blur(4px);
          box-shadow: 0 0 20px rgba(111, 97, 239, 0.2), inset 0 0 10px rgba(148, 137, 245, 0.1);
        }

        .title {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          font-size: 56px;
          font-weight: 800;
          color: var(--color-neutral);
          line-height: 1.05;
          margin: 0 0 20px 0;
          letter-spacing: -1.5px;
          text-shadow: 
            0 0 30px rgba(148, 137, 245, 0.8),
            0 0 60px rgba(111, 97, 239, 0.5),
            0 0 90px rgba(111, 97, 239, 0.3);
        }

        .subtitle-group {
          display: flex;
          flex-direction: column;
          align-items: center;
          margin-bottom: 8px;
        }

        .subtitle {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          font-size: 18px;
          color: rgba(241, 244, 248, 0.6);
          font-weight: 500;
          letter-spacing: 0.5px;
          margin: 0;
          padding-bottom: 8px;
          position: relative;
        }
        
        .subtitle::after {
          content: '';
          position: absolute;
          bottom: 0;
          left: 10%;
          right: 10%;
          height: 1px;
          background: linear-gradient(90deg, transparent, rgba(148, 137, 245, 0.3), transparent);
        }
        
        .subtitle-reflection {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          font-size: 18px;
          color: rgba(241, 244, 248, 0.2);
          font-weight: 500;
          letter-spacing: 0.5px;
          margin: 0;
          margin-top: 4px;
          filter: blur(1.5px);
        }

        .rocket-icon {
          margin-top: 32px;
          width: 32px;
          height: 32px;
          fill: var(--color-tertiary);
          filter: drop-shadow(0 0 15px rgba(148, 137, 245, 0.8));
          animation: float 4s ease-in-out infinite;
        }

        .star:nth-child(1) { top: 12%; left: 15%; width: 2px; height: 2px; animation-duration: 3s; animation-delay: 0.5s; }
        .star:nth-child(2) { top: 25%; left: 35%; width: 3px; height: 3px; animation-duration: 4s; animation-delay: 1.2s; box-shadow: 0 0 6px var(--color-primary); }
        .star:nth-child(3) { top: 8%; left: 75%; width: 1.5px; height: 1.5px; animation-duration: 2.5s; animation-delay: 0s; }
        .star:nth-child(4) { top: 40%; left: 85%; width: 2px; height: 2px; animation-duration: 5s; animation-delay: 2s; }
        .star:nth-child(5) { top: 75%; left: 18%; width: 2.5px; height: 2.5px; animation-duration: 3.5s; animation-delay: 0.8s; box-shadow: 0 0 4px var(--color-secondary); }
        .star:nth-child(6) { top: 85%; left: 45%; width: 1.5px; height: 1.5px; animation-duration: 4.5s; animation-delay: 1.5s; }
        .star:nth-child(7) { top: 60%; left: 78%; width: 3px; height: 3px; animation-duration: 3.8s; animation-delay: 0.3s; box-shadow: 0 0 8px var(--color-tertiary); }
        .star:nth-child(8) { top: 15%; left: 90%; width: 2px; height: 2px; animation-duration: 2.8s; animation-delay: 1.1s; }
        .star:nth-child(9) { top: 55%; left: 8%; width: 1.5px; height: 1.5px; animation-duration: 4.2s; animation-delay: 0.7s; }
        .star:nth-child(10) { top: 92%; left: 82%; width: 2px; height: 2px; animation-duration: 3.2s; animation-delay: 1.8s; }
        .star:nth-child(11) { top: 32%; left: 55%; width: 1px; height: 1px; animation-duration: 5.5s; animation-delay: 0.2s; }
        .star:nth-child(12) { top: 70%; left: 32%; width: 2.5px; height: 2.5px; animation-duration: 3.6s; animation-delay: 1.4s; }
        .star:nth-child(13) { top: 22%; left: 22%; width: 1.5px; height: 1.5px; animation-duration: 4.1s; animation-delay: 0.9s; }
        .star:nth-child(14) { top: 48%; left: 95%; width: 2px; height: 2px; animation-duration: 3.4s; animation-delay: 0.4s; }
        .star:nth-child(15) { top: 85%; left: 60%; width: 1.5px; height: 1.5px; animation-duration: 4.8s; animation-delay: 1.6s; }
        .star:nth-child(16) { top: 18%; left: 62%; width: 2px; height: 2px; animation-duration: 4s; animation-delay: 0.4s; }
        .star:nth-child(17) { top: 35%; left: 10%; width: 1.5px; height: 1.5px; animation-duration: 3s; animation-delay: 1s; }
        .star:nth-child(18) { top: 65%; left: 55%; width: 2px; height: 2px; animation-duration: 2.5s; animation-delay: 0.8s; }
        .star:nth-child(19) { top: 10%; left: 45%; width: 1px; height: 1px; animation-duration: 5s; animation-delay: 1.2s; }
        .star:nth-child(20) { top: 80%; left: 92%; width: 2px; height: 2px; animation-duration: 3.2s; animation-delay: 0.6s; }
      </style>

      <div class="space-container">
        <div class="nebula nebula-1"></div>
        <div class="nebula nebula-2"></div>

        <div class="stars">
          <div class="star"></div><div class="star"></div><div class="star"></div>
          <div class="star"></div><div class="star"></div><div class="star"></div>
          <div class="star"></div><div class="star"></div><div class="star"></div>
          <div class="star"></div><div class="star"></div><div class="star"></div>
          <div class="star"></div><div class="star"></div><div class="star"></div>
          <div class="star"></div><div class="star"></div><div class="star"></div>
          <div class="star"></div><div class="star"></div>
        </div>
        
        <div class="ambient-shape shape-circle-top"></div>
        <div class="ambient-shape shape-circle-bottom"></div>
        
        <svg xmlns="http://www.w3.org/2000/svg" class="ambient-shape shape-triangle" viewBox="0 0 100 100">
          <defs>
            <linearGradient id="tri-grad" x1="0%" y1="100%" x2="100%" y2="0%">
              <stop offset="0%" style="stop-color:var(--color-primary);stop-opacity:1" />
              <stop offset="30%" style="stop-color:#D870BA;stop-opacity:1" />
              <stop offset="70%" style="stop-color:var(--color-secondary);stop-opacity:1" />
              <stop offset="100%" style="stop-color:#FF9A9E;stop-opacity:1" />
            </linearGradient>
          </defs>
          <polygon points="50,15 90,85 10,85" fill="url(#tri-grad)" />
          <polygon points="55,20 85,80 15,80" fill="rgba(255,255,255,0.2)" /> <!-- Inner bevel for 3D effect -->
        </svg>

        <div class="content">
          <div class="pill-container">
            <div class="pill">Hello World!</div>
          </div>
          
          <h1 class="title">
            Alex David Tuirán<br/>Martínez
          </h1>
          
          <div class="subtitle-group">
            <p class="subtitle">Software Developer &#xa0;|&#xa0; Fullstack Developer &#xa0;|&#xa0; Web Engineer</p>
            <p class="subtitle-reflection">Software Developer &#xa0;|&#xa0; Fullstack Developer &#xa0;|&#xa0; Web Engineer</p>
          </div>
          
          <!-- Modern Rocket Vector -->
          <svg xmlns="http://www.w3.org/2000/svg" class="rocket-icon" viewBox="0 0 24 24">
            <path d="M12.984 3c-2.35 0-5.741 1.62-8.358 4.237a11.166 11.166 0 00-2.822 4.417c-.366.98-.073 2.091.737 2.766l1.096.914a.75.75 0 00.917-.075l2.435-2.222a.75.75 0 011.02.016l1.83 1.83a.75.75 0 01.016 1.02l-2.222 2.435a.75.75 0 00-.075.917l.914 1.096c.675.81 1.786 1.103 2.766.737a11.166 11.166 0 004.417-2.822C20.406 15.65 22.026 12.26 22.026 9.91c0-4.498-4.542-6.91-9.042-6.91zm1.758 7.625a2.25 2.25 0 113.182-3.182 2.25 2.25 0 01-3.182 3.182z" />
          </svg>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>